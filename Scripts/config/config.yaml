# MagNet ML Project — Config
# cnnv3 added: B+H waveform model with FiLM conditioning

data:
  raw_path: "/content/drive/MyDrive/MagNet_DataSet"
  processed_path: "/content/drive/MyDrive/MagNet_DataSet/processed"
  batch_size: 64
  test_split: 0.2

models:
  scaler:
    name: scaler
    version: 2
    hidden_dim: 64
    layers: 3
    features:
      inputs:
        B_pk: standard
        Frequency: standard
        Temperature: standard
        Hdc: standard
      targets:
        Loss: standard

  scalerv2:
    name: scalerv2
    version: 1
    hidden_dim: 256
    layers: 5
    dropout: 0.2
    features:
      inputs:
        B_pk: standard
        Frequency: standard
        Temperature: standard
        Hdc: standard
      targets:
        Loss: log10

  sequence:
    name: sequence
    version: 1
    hidden_dim: 128
    num_layers: 2
    features:
      inputs:
        B: standard
        Frequency: standard
        Temperature: standard
        Hdc: standard
      targets:
        Loss: standard

  seq2seq:
    name: seq2seq
    version: 1
    encoder_dim: 128
    decoder_dim: 128
    features:
      inputs:
        B: standard
      targets:
        H: standard
        Loss: standard

  cnn:
    name: cnn
    version: 1
    kernel_size: 3
    num_channels: 64
    num_layers: 3
    features:
      inputs:
        B: minmax
        Frequency: standard
        Temperature: standard
        Hdc: standard
      targets:
        Loss: log10

  cnnv2:
    name: cnnv2
    version: "A"
    kernel_size: 3
    num_channels: 64
    num_layers: 3
    features:
      inputs:
        B:           minmax
        Frequency:   standard
        Temperature: standard
      targets:
        Loss:        log10

  # ── CNNv3 ──────────────────────────────────────────────────────────────────
  # Architecture : MultiScaleConv → FiLM → ResConvBlocks → FiLM → head
  # Waveform inputs : B  (minmax)  +  H  (standard)
  # Scalar conditions: Frequency + Temperature   (scalar_dim = 2)
  # Target           : Loss  (log10 — power law spans decades)
  #
  # __getitem__ return signature:
  #   B (T,1),  H (T,1),  scalars (2,),  y (1,)
  # ──────────────────────────────────────────────────────────────────────────
  cnnv3:
    name: cnnv3
    version: "Material_3E6"
    num_channels: 96      # must be divisible by 3  (MultiScaleConv uses 3 branches)
    num_layers: 4
    scalar_dim: 2         # Frequency + Temperature
    dropout: 0.15
    features:
      inputs:
        B:           minmax    # waveform — shape (N, T)
        H:           standard  # waveform — shape (N, T)
        Frequency:   standard  # scalar   — shape (N, 1)
        Temperature: standard  # scalar   — shape (N, 1)
      targets:
        Loss:        log10     # volumetric power loss

  transformer:
    name: transformer
    version: 1
    d_model: 64
    nhead: 4
    num_layers: 2
    dim_feedforward: 128
    dropout: 0.1
    features:
      inputs:
        B: standard
        Frequency: standard
        Temperature: standard
        Hdc: standard
      targets:
        Loss: standard

training:
  epochs: 100
  learning_rate: 0.001
  weight_decay: 0.0001
  grad_clip: 1.0
  save_dir: "/content/drive/MyDrive/MagNet/checkpoints"

  scheduler:
    type: "ReduceLROnPlateau"
    factor: 0.5
    patience: 5
    min_lr: 1e-6
    step_size: 10
    gamma: 0.1

  early_stopping:
    enabled: true
    patience: 10
    min_delta: 0.0001

tensorboard:
  log_dir: "/content/drive/MyDrive/MagNet/runs"
  run_id: "v3_cnnv3"

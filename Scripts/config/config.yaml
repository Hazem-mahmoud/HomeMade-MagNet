# MagNet ML Project — Config v2
# Scaler v3 and CNN v2 changes are marked with [CHANGED]

data:
  raw_path: "/content/drive/MyDrive/MagNet_DataSet"
  processed_path: "/content/drive/MyDrive/MagNet_DataSet/processed"
  batch_size: 64          # [CHANGED] 32 → 64: larger batches stabilize BatchNorm
  test_split: 0.2

models:
  scalerv2:
    name: scalerv2
    version: 1            # [CHANGED] v2 → v3
    hidden_dim: 256       # [CHANGED] 64 → 256
    layers: 5             # [CHANGED] 3 → 5
    dropout: 0.2          # [CHANGED] added
    features:
      inputs:
        B_pk: standard
        Frequency: standard
        Temperature: standard
        Hdc: standard
      targets:
        Loss: log10       # [CHANGED] standard → log10 (power loss spans decades)

  scaler:
    name: scaler
    version: 2
    hidden_dim: 64
    layers: 3
    features:
      inputs:
        B_pk: standard
        Frequency: standard
        Temperature: standard
        Hdc: standard
      targets:
        Loss: standard




  sequence:
    name: sequence
    version: 1
    hidden_dim: 128
    num_layers: 2
    features:
      inputs:
        B: standard
        Frequency: standard
        Temperature: standard
        Hdc: standard
      targets:
        Loss: standard

  seq2seq:
    name: seq2seq
    version: 1
    encoder_dim: 128
    decoder_dim: 128
    features:
      inputs:
        B: standard
      targets:
        H: standard       # [FIXED] H only in targets (was also in inputs — bug)
        Loss: standard

  cnnv2:
    name: cnnv2
    version: 1            # [CHANGED] v1 → v2
    num_channels: 96      # [CHANGED] replaces kernel_size/num_channels — divisible by 3
    num_layers: 4         # [CHANGED] 3 → 4
    dropout: 0.15         # [CHANGED] added
    features:
      inputs:
        B: minmax
        Frequency: standard
        Temperature: standard
        Hdc: standard
      targets:
        Loss: log10       # [CHANGED] kept log10 — correct for power law targets

  cnn:
    name: cnn
    version: 1
    kernel_size: 3
    num_channels: 64
    num_layers: 3
    features:
      inputs:
        B: minmax
        Frequency: standard
        Temperature: standard
        Hdc: standard
      targets:
        Loss: log10


  transformer:
    name: transformer
    version: 1
    d_model: 64
    nhead: 4
    num_layers: 2
    dim_feedforward: 128
    dropout: 0.1
    features:
      inputs:
        B: standard
        Frequency: standard
        Temperature: standard
        Hdc: standard
      targets:
        Loss: standard

training:
  epochs: 100
  learning_rate: 0.001
  weight_decay: 0.0001    # [CHANGED] added L2 regularization
  grad_clip: 1.0          # [CHANGED] added gradient clipping (critical for stability)
  save_dir: "/content/drive/MyDrive/MagNet/checkpoints"

  scheduler:
    type: "ReduceLROnPlateau"
    factor: 0.5
    patience: 5
    min_lr: 1e-6
    step_size: 10
    gamma: 0.1

  early_stopping:
    enabled: true
    patience: 10
    min_delta: 0.0001

tensorboard:
  log_dir: "/content/drive/MyDrive/MagNet/runs"
  run_id: "v2_scaler_cnn"   # [CHANGED] updated run tag
# Configuration parameters for MagNet ML Project

# Data settings
data:
  raw_path: "/content/drive/MyDrive/MagNet_DataSet"
  processed_path: "/content/drive/MyDrive/MagNet_DataSet/processed"
  batch_size: 32
  test_split: 0.2

# Model settings
models:
  scaler:
    name: scaler
    version: 1
    hidden_dim: 64
    layers: 3
    features:
      inputs:
        B_pk: standard
        Frequency: standard
        Temperature: standard
        Hdc: standard
      targets:
        Loss: standard

  sequence:
    name: sequence
    version: 1
    hidden_dim: 128
    num_layers: 2
    features:
      inputs:
        B: standard
        Frequency: standard
        Temperature: standard
        Hdc: standard
      targets:
        Loss: standard

  seq2seq:
    name: seq2seq
    version: 1
    encoder_dim: 128
    decoder_dim: 128
    features:
      inputs:
        B: standard
        H: standard
      targets:
        Loss: standard

  cnn:
    name: cnn
    version: 1
    kernel_size: 3
    num_channels: 64
    num_layers: 3
    features:
      inputs:
        B: minmax
        Frequency: standard
        Temperature: standard
        Hdc: standard
      targets:
        Loss: log10

  transformer:
    name: transformer
    version: 1
    d_model: 64
    nhead: 4
    num_layers: 2
    dim_feedforward: 128
    dropout: 0.1
    features:
      inputs:
        B: standard
        Frequency: standard
        Temperature: standard
        Hdc: standard
      targets:
        Loss: standard

# Training settings
training:
  epochs: 100
  learning_rate: 0.001
  save_dir: "/content/drive/MyDrive/MagNet/checkpoints"

# logs folder
tensorboard:
  log_dir: "/content/drive/MyDrive/MagNet/runs"        # root folder for all TB logs
  run_id: "baseline"     # change this per experiment